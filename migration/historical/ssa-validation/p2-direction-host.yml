name: P2 genuine candidate simulator compilation
on:
  push:
    branches: [validation/p2-alert-lifecycle]
    paths:
      - .github/workflows/p2-direction-host.yml
      - ci/p2/direction_host/**
permissions:
  contents: read
concurrency:
  group: p2-direction-host-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile:
    if: github.repository == 'NRG-Wardog/sidestore-auto-refresh' && github.ref == 'refs/heads/validation/p2-alert-lifecycle'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      APPROVED_HOST_INPUTS: 6bfdd841663e665e1b9b06847995dc5a3d48e6eba1a4bc81b47463295e97b860
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_COUNT: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: builder
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NRG-Wardog/LiveContainer
          ref: f46a3e14c0752714144aa076355663c79a54f1a9
          path: source
          persist-credentials: false
          set-safe-directory: false
          submodules: false
      - name: Check exact command budgets and input seal
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s builder/ci/p2/direction_host -p 'test_*.py' -v
      - name: Compile genuine Release simulator target
        shell: bash
        run: |
          set -euo pipefail
          python3 -B builder/ci/p2/direction_host/run.py --host "$GITHUB_WORKSPACE/source" \
            --work "$GITHUB_WORKSPACE/p2-host-work" --evidence "$GITHUB_WORKSPACE/p2-host-evidence" \
            --publish "$GITHUB_WORKSPACE/p2-host-publish" --approved "$APPROVED_HOST_INPUTS"
      - name: Retain settled compilation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-direction-host-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: p2-host-publish/**
          if-no-files-found: error
          retention-days: 30
