name: Device verification
description: Report a successful or failed real-device CoreDevice / refresh compatibility test
title: "[Device]: "
body:
  - type: markdown
    attributes:
      value: |
        The current proof device has completed a full PC-free scheduled refresh. Additional real-device reports are used to map compatibility across iPhone/iPad models, iOS versions, and Wi-Fi network ranges.

        Do not upload pairing files, private keys, Apple credentials, signed personal IPAs, exact private network addresses if you do not want to disclose them, or unredacted private device logs.

  - type: dropdown
    id: product_line
    attributes:
      label: Product line
      description: Select the package you tested, not the upstream version displayed inside LiveContainer or SideStore. Do not guess if unsure.
      options:
        - "v1 - Standalone SideStore"
        - "v2 - Combined LiveContainer + SideStore"
        - "v3 - Unified LiveContainer + SideStore test build"
        - "Multiple product lines - identify each below"
        - "Builder / CI only"
        - "Not sure - provide the download source below"
    validations:
      required: true

  - type: input
    id: release_version
    attributes:
      label: Exact release or build version
      description: Copy the repository release tag or builder commit. "Latest", "3.8.9", or "SideStore 0.7.0" alone cannot identify this project's package. If unknown, write "Unknown" and provide the download source below.
      placeholder: "Release tag v2.1.0, or full builder commit for a test build"
    validations:
      required: true

  - type: textarea
    id: build_source
    attributes:
      label: Download source and IPA filename
      description: Paste the release URL or GitHub Actions run URL and the exact IPA filename. For a local build, give the branch and full builder commit. For multiple devices/packages, identify the build used on each. Do not upload the IPA or private signing material.
      placeholder: |
        Release or Actions run URL:
        IPA filename:
        Builder commit (if known):
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: iPhone 12
    validations:
      required: true

  - type: input
    id: ios
    attributes:
      label: iOS version
      placeholder: iOS 26.6.1
    validations:
      required: true

  - type: dropdown
    id: network_family
    attributes:
      label: Wi-Fi IPv4 network family
      description: Exact private IP addresses are not needed.
      options:
        - 10.x private range
        - 192.168.x private range
        - 172.16-31.x private range
        - Other IPv4 range
        - Prefer not to disclose
    validations:
      required: true

  - type: dropdown
    id: localdevvpn_route
    attributes:
      label: LocalDevVPN same-subnet /32 configuration
      options:
        - Configured and connected
        - Configured but LocalDevVPN would not stay connected
        - Could not configure successfully
        - Not tested
    validations:
      required: true

  - type: dropdown
    id: manual
    attributes:
      label: Manual Refresh All over CoreDevice
      options:
        - Success
        - Failed
        - Not tested
    validations:
      required: true

  - type: dropdown
    id: pc
    attributes:
      label: Was the PC/USB disconnected during the scheduled test?
      options:
        - Yes
        - No
        - Scheduled execution not tested
    validations:
      required: true

  - type: dropdown
    id: scheduled
    attributes:
      label: Native scheduled refresh result
      options:
        - Triggered and completed successfully
        - Triggered but failed
        - Request was scheduled but did not trigger yet
        - Not tested
    validations:
      required: true

  - type: textarea
    id: markers
    attributes:
      label: Non-sensitive evidence
      description: For a full autonomous success, include the relevant redacted TRIGGER, AUTH_PREFLIGHT_PASS, OPERATION_START, and COMPLETE success=true markers.
      render: text

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Include LocalDevVPN behavior, refreshed apps, expiration-date result, route/setup observations, and anything unusual.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirmed this report contains no pairing records, private keys, Apple credentials, signed personal IPAs, or unnecessary device identifiers.
          required: true
