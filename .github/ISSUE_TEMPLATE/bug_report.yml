name: Bug report
description: Report a reproducible build, transport, refresh, or installation problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not upload pairing files, private keys, Apple credentials, signed personal IPAs, or unredacted private device logs.

  - type: dropdown
    id: product_line
    attributes:
      label: Product line
      description: Select the package you tested, not the upstream version displayed inside LiveContainer or SideStore. Do not guess if unsure.
      options:
        - "v1 - Standalone SideStore"
        - "v2 - Combined LiveContainer + SideStore"
        - "v3 - Unified LiveContainer + SideStore test build"
        - "Multiple product lines - identify each below"
        - "Builder / CI only"
        - "Not sure - provide the download source below"
    validations:
      required: true

  - type: input
    id: release_version
    attributes:
      label: Exact release or build version
      description: Copy the repository release tag or builder commit. "Latest", "3.8.9", or "SideStore 0.7.0" alone cannot identify this project's package. If unknown, write "Unknown" and provide the download source below.
      placeholder: "Release tag v2.1.0, or full builder commit for a test build"
    validations:
      required: true

  - type: textarea
    id: build_source
    attributes:
      label: Download source and IPA filename
      description: Paste the release URL or GitHub Actions run URL and the exact IPA filename. For a local build, give the branch and full builder commit. For multiple devices/packages, identify the build used on each. Do not upload the IPA or private signing material.
      placeholder: |
        Release or Actions run URL:
        IPA filename:
        Builder commit (if known):
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: iPhone/iPad model used for the test.
      placeholder: iPhone 12
    validations:
      required: true

  - type: input
    id: ios
    attributes:
      label: iOS version
      placeholder: iOS 26.6.1
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Failure area
      options:
        - GitHub Actions build
        - Initial installation
        - LocalDevVPN / route discovery
        - CoreDevice transport
        - Manual Refresh All
        - Background scheduling
        - Scheduled background execution
        - Refresh history / UI
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the shortest exact sequence that reproduces the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: textarea
    id: markers
    attributes:
      label: Relevant non-sensitive markers
      description: Paste only the minimum redacted AUTO_REFRESH / SIDESTORE_COREDEVICE / SELF_REFRESH markers needed to diagnose the issue.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirmed this report does not contain pairing records, private keys, Apple credentials, signed personal IPAs, or unnecessary device identifiers.
          required: true
