name: Refresh outcome source-owned native qualification
on:
  workflow_dispatch:
  push:
    branches: ['validation/refresh-truth-preflight']
    paths: ['ci/refresh-truth/**', 'ci/issues-native/**', 'ci/multitask-launch/source.json', '.github/workflows/refresh-truth-preflight.yml']
permissions:
  contents: read
concurrency:
  group: refresh-truth-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'NRG-Wardog/sidestore-auto-refresh' && github.ref == 'refs/heads/validation/refresh-truth-preflight'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      RUSTUP_TOOLCHAIN: '1.98.1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_ALLOW_PROTOCOL: https
      GIT_NO_REPLACE_OBJECTS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize evidence outside source owners
        id: initialized
        run: mkdir -p evidence
      - name: Checkout exact harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NRG-Wardog/sidestore-auto-refresh
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false
      - name: Acquire and verify exact reviewed source graph
        id: source_gate
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B harness/ci/issues-native/record.py acquire 2>&1 | tee evidence/acquisition.log
          python3 -B harness/ci/issues-native/record.py snapshot acquired
          python3 -B harness/ci/issues-native/verify_candidate_graph.py
          python3 -B harness/ci/issues-native/test_current_bindings.py
          python3 -B harness/ci/issues-native/test_refresh_truth_setup_projection.py
          python3 -B harness/ci/issues-native/test_refresh_truth_host_bundle_projection.py
          python3 -B harness/ci/issues-native/test_refresh_truth_flow_projection.py
          python3 -B harness/ci/issues-native/test_cold_vpn_cache_projection.py
          python3 -B harness/ci/issues-native/verify_current_bindings.py --sources sources --output evidence/current-source-bindings.json
          python3 -B harness/ci/issues-native/project_candidate_contracts.py
          python3 -B harness/ci/issues-native/test_refresh_truth_receipt.py
          python3 -B harness/ci/issues-native/test_refresh_truth_orchestration.py
          python3 -B harness/ci/issues-native/test_russian_localization.py
          python3 -B -m unittest discover -s harness/ci/cold-vpn -p 'test_*.py' -v
          xcodebuild -version | grep -Fx 'Xcode 26.4.1'
      - name: Execute actual Swift policy and owned-memory fixtures
        id: swift_tests
        run: |
          set -euo pipefail
          python3 -B harness/ci/refresh-truth/run.py swift --sources sources --output evidence 2>&1 | tee evidence/refresh-truth-swift-driver.log
      - name: Retain immediate Swift failure diagnostics before independent Rust tests
        id: swift_failure_diagnostics
        if: ${{ !cancelled() && steps.source_gate.outcome == 'success' && steps.swift_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refresh-truth-swift-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/refresh-truth*.json
            evidence/refresh-truth*.log
          if-no-files-found: error
          retention-days: 14
      - name: Execute existing cold VPN source-owned regression and deployment typecheck
        id: cold_vpn_tests
        if: ${{ !cancelled() && steps.source_gate.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B harness/ci/issues-native/record.py snapshot before-cold-fixtures
          cmp evidence/acquired.json evidence/before-cold-fixtures.json
          python3 -B harness/ci/cold-vpn/run_cold_vpn_tests.py --sources sources --output evidence 2>&1 | tee evidence/cold-vpn-driver.log
      - name: Retain immediate cold VPN failure diagnostics
        if: ${{ !cancelled() && steps.source_gate.outcome == 'success' && steps.cold_vpn_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refresh-truth-cold-vpn-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/cold-vpn-driver.log
            evidence/cold-vpn/*.log
            evidence/cold-vpn/*.json
            evidence/cold-vpn-tests.json
          if-no-files-found: error
          retention-days: 14
      - name: Execute existing comprehensive auth and IPC fixtures
        id: comprehensive_tests
        if: ${{ !cancelled() && steps.source_gate.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 -B harness/ci/issues-native/record.py snapshot before-comprehensive_tests
          cmp evidence/acquired.json evidence/before-comprehensive_tests.json
          python3 -B harness/ci/issues-native/verify_comprehensive_diagnostics.py --sources sources --swiftc "$(command -v swiftc)" --output evidence/comprehensive-diagnostics --contract evidence/candidate-contracts/comprehensive-diagnostics-contract.json 2>&1 | tee evidence/comprehensive_tests-driver.log
      - name: Retain immediate comprehensive_tests failure evidence
        if: ${{ !cancelled() && steps.source_gate.outcome == 'success' && steps.comprehensive_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refresh-truth-comprehensive_tests-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/comprehensive_tests-driver.log
            evidence/comprehensive-diagnostics/
          if-no-files-found: error
          retention-days: 14
      - name: Execute existing full setup recovery fixtures
        id: setup_tests
        if: ${{ !cancelled() && steps.source_gate.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 -B harness/ci/issues-native/record.py snapshot before-setup_tests
          cmp evidence/acquired.json evidence/before-setup_tests.json
          python3 -B harness/ci/issues-native/verify_setup_state_recovery.py run --sources sources --swiftc "$(command -v swiftc)" --output evidence/setup-state-recovery --contract evidence/candidate-contracts/setup-state-recovery-contract.json 2>&1 | tee evidence/setup_tests-driver.log
      - name: Retain immediate setup_tests failure evidence
        if: ${{ !cancelled() && steps.source_gate.outcome == 'success' && steps.setup_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refresh-truth-setup_tests-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/setup_tests-driver.log
            evidence/setup-state-recovery/
          if-no-files-found: error
          retention-days: 14
      - name: Execute compiled Russian resources and production renderer
        id: russian_tests
        if: ${{ !cancelled() && steps.source_gate.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 -B harness/ci/issues-native/record.py snapshot before-russian_tests
          cmp evidence/acquired.json evidence/before-russian_tests.json
          python3 -B harness/ci/issues-native/verify_russian_localization.py --live sources/LiveContainer --output evidence/russian-localization 2>&1 | tee evidence/russian_tests-driver.log
      - name: Retain immediate russian_tests failure evidence
        if: ${{ !cancelled() && steps.source_gate.outcome == 'success' && steps.russian_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refresh-truth-russian_tests-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/russian_tests-driver.log
            evidence/russian-localization/
          if-no-files-found: error
          retention-days: 14
      - name: Select exact previously qualified Rust compiler
        id: rust_tools
        if: ${{ !cancelled() && steps.source_gate.outcome == 'success' }}
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          test "$(cargo +1.98.1 --version)" = 'cargo 1.98.1 (797e8a9bc 2026-08-05)'
      - name: Execute actual Rust response parser and owned-deadline FFI fixtures
        id: rust_tests
        if: ${{ !cancelled() && steps.source_gate.outcome == 'success' && steps.rust_tools.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B harness/ci/refresh-truth/run.py rust --sources sources --output evidence 2>&1 | tee evidence/refresh-truth-rust-driver.log
      - name: Require every native fixture and unchanged tested source
        id: sealed
        if: ${{ !cancelled() && steps.source_gate.outcome == 'success' }}
        run: |
          set -euo pipefail
          test '${{ steps.swift_tests.outcome }}' = success
          test '${{ steps.rust_tests.outcome }}' = success
          test '${{ steps.cold_vpn_tests.outcome }}' = success
          test '${{ steps.comprehensive_tests.outcome }}' = success
          test '${{ steps.setup_tests.outcome }}' = success
          test '${{ steps.russian_tests.outcome }}' = success
          python3 -B harness/ci/refresh-truth/run.py seal --sources sources --output evidence
          python3 -B harness/ci/issues-native/record.py snapshot after-fixtures
          cmp evidence/acquired.json evidence/after-fixtures.json
      - name: Retain bounded synthetic diagnostics and qualification receipt
        if: ${{ !cancelled() && steps.initialized.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refresh-truth-preflight-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/*.json
            evidence/*.log
            evidence/comprehensive-diagnostics/
            evidence/setup-state-recovery/
            evidence/russian-localization/
            evidence/cold-vpn/*.log
            evidence/cold-vpn/*.json
          if-no-files-found: error
          retention-days: 14
