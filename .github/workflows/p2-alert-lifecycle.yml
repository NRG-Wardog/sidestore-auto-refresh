name: P2 isolated UIKit alert lifecycle
on:
  push:
    branches: [validation/p2-alert-lifecycle]
permissions:
  contents: read
concurrency:
  group: p2-alert-lifecycle-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lifecycle:
    if: github.repository == 'NRG-Wardog/sidestore-auto-refresh' && github.ref == 'refs/heads/validation/p2-alert-lifecycle'
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      APPROVED_ALERT_INPUTS_SHA256: 19c73356619d9cf46d10dff2b2f0cc9e8d2e7661e578bbec5368c69942d81b42
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_COUNT: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: builder
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NRG-Wardog/LiveContainer
          ref: dba20ab374b510b094c82325ba6c425a675fe393
          path: maintained-source
          persist-credentials: false
          set-safe-directory: false
      - name: Verify seven-case extraction and strict lifecycle gates
        env:
          P2_ALERT_SOURCE: ${{ github.workspace }}/maintained-source
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s builder/ci/p2/alerts -p test_lane.py -v
      - name: Execute isolated hosted UIKit lifecycle tests
        run: |
          set -euo pipefail
          python3 -B builder/ci/p2/alerts/run.py --host "$GITHUB_WORKSPACE/maintained-source" \
            --approved-inputs-sha256 "$APPROVED_ALERT_INPUTS_SHA256" \
            --work "$GITHUB_WORKSPACE/p2-alert-work" --evidence "$GITHUB_WORKSPACE/p2-alert-evidence"
      - name: Retain raw native results and exact sources on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-alert-lifecycle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: p2-alert-evidence/**
          if-no-files-found: error
          retention-days: 30
