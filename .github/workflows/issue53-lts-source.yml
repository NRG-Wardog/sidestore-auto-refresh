name: Qualify generated OpenSSL 3.5 LTS host candidate
on:
  workflow_dispatch:
  push:
    branches: ['test/issue53-lts-source']
    paths: ['ci/issue53-lts/**', 'ci/issue53-crypto/**', '.github/workflows/issue53-lts-source.yml']
permissions:
  contents: read
concurrency:
  group: issue53-lts-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'NRG-Wardog/sidestore-auto-refresh' && github.ref == 'refs/heads/test/issue53-lts-source'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_ALLOW_PROTOCOL: https
      GIT_NO_REPLACE_OBJECTS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false
      - name: Validate recipe and preserve attempt evidence
        run: |
          set -euo pipefail
          mkdir evidence
          printf 'workflow_commit=%s\nrun_id=%s\nexperimental_generated_dependency=true\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > evidence/identity.txt
          cp ci/issue53-lts/source.json evidence/lts-source.json
          python3 -B ci/issue53-lts/test_recipe.py 2>&1 | tee evidence/recipe-controls.log
          python3 -B ci/issue53-crypto/test_controls.py 2>&1 | tee evidence/crypto-controls.log
          python3 -B ci/issue53-crypto/test_consumer_contract.py 2>&1 | tee evidence/consumer-controls.log
      - name: Build explicit official LTS source as isolated native macOS framework
        id: lts
        run: |
          set -euo pipefail
          python3 -B ci/issue53-lts/build.py --output lts-build 2>&1 | tee evidence/lts-build-driver.log
          cp lts-build/build-receipt.json lts-build/configdata.txt lts-build/headers.json evidence/
      - name: Acquire unchanged comparison libraries and maintained signer source
        id: comparisons
        if: ${{ !cancelled() && steps.lts.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B ci/issue53-crypto/acquire.py --output inputs 2>&1 | tee evidence/comparison-acquisition.log
          python3 -B ci/issue53-crypto/consumer.py acquire --inputs inputs 2>&1 | tee evidence/signer-acquisition.log
          cp inputs/acquisition.json ci/issue53-crypto/zsign-source.json evidence/
      - name: Qualify only generated LTS host candidate with unchanged embedded comparison
        if: ${{ !cancelled() && steps.comparisons.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B ci/issue53-lts/qualify.py --built lts-build --inputs inputs --evidence evidence 2>&1 | tee evidence/lts-qualification-driver.log
      - name: Preserve build log even on failure
        if: always()
        run: |
          mkdir -p evidence
          if test -f lts-build/build.log; then cp lts-build/build.log evidence/lts-build.log; fi
      - name: Upload non-secret qualification evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue53-lts-source-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
