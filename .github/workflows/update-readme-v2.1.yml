name: Update README v2.1.0

on:
  push:
    branches:
      - main
    paths:
      - '.tmp/update_readme_v210.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply README and screenshot update
        run: python3 .tmp/update_readme_v210.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document combined v2.1.0 and add screenshots"
          git push origin HEAD:main
