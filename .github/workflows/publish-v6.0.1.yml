name: Promote verified corrected LiveContainer and SideStore 6.0.1
on:
  push:
    branches: [validation/publication-v6.0.1]
    paths: ['.github/workflows/publish-v6.0.1.yml', '.ci/release-v6.0.1/**']
permissions: {}
concurrency:
  group: public-release-v6.0.1
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'NRG-Wardog/sidestore-auto-refresh' && github.ref == 'refs/heads/validation/publication-v6.0.1' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      inventory_sha256: ${{ steps.prepare.outputs.inventory_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Test promotion safety gates
        run: python3 -B -m unittest discover -s .ci/release-v6.0.1 -p 'test_*.py' -v
      - name: Verify all exact successful CI and unchanged artifact
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .ci/release-v6.0.1/promote.py prepare release-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-release-v6.0.1-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  publish:
    needs: verify
    if: github.repository == 'NRG-Wardog/sidestore-auto-refresh' && github.ref == 'refs/heads/validation/publication-v6.0.1' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Download only this run's verified publication bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "public-release-v6.0.1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --dir release-bundle
      - name: Publish verified allowlist and make corrected release latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_INVENTORY_SHA256: ${{ needs.verify.outputs.inventory_sha256 }}
        run: python3 -B .ci/release-v6.0.1/promote.py publish release-bundle --inventory-sha256 "$VERIFIED_INVENTORY_SHA256"
