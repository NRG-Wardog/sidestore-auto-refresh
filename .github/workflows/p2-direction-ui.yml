name: P2 genuine four-language Settings UI
on:
  push:
    branches: [validation/p2-alert-lifecycle]
    paths:
      - .github/workflows/p2-direction-ui.yml
      - ci/p2/direction_ui/**
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-direction-ui-${{ github.ref }}
  cancel-in-progress: false
jobs:
  settings:
    if: github.repository == 'NRG-Wardog/sidestore-auto-refresh' && github.ref == 'refs/heads/validation/p2-alert-lifecycle'
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      APPROVED_UI_INPUTS: 24b882c0a2912fc6a9578381e856d8040f47951ea3a78bdb5ac401ad66b80e9f
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_COUNT: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: builder
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NRG-Wardog/LiveContainer
          ref: f46a3e14c0752714144aa076355663c79a54f1a9
          path: source
          persist-credentials: false
          set-safe-directory: false
          submodules: false
      - name: Portable observation and ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s builder/ci/p2/direction_ui -p 'test_*.py' -v
      - name: Download authenticated candidate simulator build
        shell: bash
        env:
          P2_ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B builder/ci/p2/direction_ui/fetch_artifact.py --output "$GITHUB_WORKSPACE/p2-ui-input"
      - name: Observe genuine Settings in four languages
        shell: bash
        run: |
          set -euo pipefail
          python3 -B builder/ci/p2/direction_ui/run.py --artifact "$GITHUB_WORKSPACE/p2-ui-input/artifact.zip" \
            --source "$GITHUB_WORKSPACE/source" --work "$GITHUB_WORKSPACE/p2-ui-work" \
            --evidence "$GITHUB_WORKSPACE/p2-ui-evidence" --publish "$GITHUB_WORKSPACE/p2-ui-publish" \
            --approved "$APPROVED_UI_INPUTS"
      - name: Retain settled Settings evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-direction-ui-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            p2-ui-publish/**
            p2-ui-input/download.json
          if-no-files-found: error
          retention-days: 30
