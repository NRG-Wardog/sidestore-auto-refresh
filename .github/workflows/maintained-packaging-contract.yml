name: Verify maintained packaging source
on:
  push:
    branches: [main]
    paths:
      - 'scripts/package_livecontainer_combined.py'
      - 'scripts/audit_ipa_signing.py'
      - 'scripts/vendor/dylibify/**'
      - 'tests/test_combined_packaging.py'
      - 'tests/test_dylibify_source_build.py'
      - '.github/workflows/maintained-packaging-contract.yml'
      - 'ci/source-integrity/**'
      - 'scripts/packaging_adapters.py'
      - 'scripts/ipa_size_report.py'
      - 'tests/test_packaging_adapters.py'
      - 'tests/test_ipa_size_report.py'
      - 'scripts/rehearse_packaging_integration.py'
      - 'tests/fixtures/upstream-packaging/**'
      - 'ci/packaging/patch-surface.json'
  pull_request:
    paths:
      - 'scripts/package_livecontainer_combined.py'
      - 'scripts/audit_ipa_signing.py'
      - 'scripts/vendor/dylibify/**'
      - 'tests/test_combined_packaging.py'
      - 'tests/test_dylibify_source_build.py'
      - '.github/workflows/maintained-packaging-contract.yml'
      - 'ci/source-integrity/**'
      - 'scripts/packaging_adapters.py'
      - 'scripts/ipa_size_report.py'
      - 'tests/test_packaging_adapters.py'
      - 'tests/test_ipa_size_report.py'
      - 'scripts/rehearse_packaging_integration.py'
      - 'tests/fixtures/upstream-packaging/**'
      - 'ci/packaging/patch-surface.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity:
    name: Reviewed source integrity (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject source drift and malformed manifests
        run: python3 -B -m unittest discover -s ci/source-integrity -p 'test_*.py' -v
      - name: Verify reviewed current source boundaries
        run: python3 -B ci/source-integrity/verify.py
  packaging-contract:
    needs: source-integrity
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed current packaging source
        run: python3 -B ci/source-integrity/verify.py
      - name: Reject malformed manifests and source drift
        run: python3 -B -m unittest discover -s ci/source-integrity -p 'test_integrity.py' -v
      - name: Exercise synthetic packaging and source-built converter contracts
        shell: bash
        run: |
          set -euo pipefail
          command -v xcrun
          xcrun --find clang
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p test_combined_packaging.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p test_dylibify_source_build.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p test_packaging_adapters.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p test_ipa_size_report.py -v
