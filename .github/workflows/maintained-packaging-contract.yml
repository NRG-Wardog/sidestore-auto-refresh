name: Verify maintained 6.0 packaging source
on:
  push:
    branches: [main]
    paths:
      - 'scripts/package_livecontainer_combined.py'
      - 'scripts/audit_ipa_signing.py'
      - 'scripts/vendor/dylibify/**'
      - 'tests/test_combined_packaging.py'
      - 'tests/test_dylibify_source_build.py'
      - '.github/workflows/maintained-packaging-contract.yml'
      - 'ci/validation-history/**'
      - 'scripts/packaging_adapters.py'
      - 'scripts/ipa_size_report.py'
      - 'tests/test_packaging_adapters.py'
      - 'tests/test_ipa_size_report.py'
      - 'scripts/rehearse_packaging_integration.py'
      - 'tests/fixtures/upstream-packaging/**'
      - 'docs/PACKAGING_PATCH_SURFACE.json'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/package_livecontainer_combined.py'
      - 'scripts/audit_ipa_signing.py'
      - 'scripts/vendor/dylibify/**'
      - 'tests/test_combined_packaging.py'
      - 'tests/test_dylibify_source_build.py'
      - '.github/workflows/maintained-packaging-contract.yml'
      - 'ci/validation-history/**'
      - 'scripts/packaging_adapters.py'
      - 'scripts/ipa_size_report.py'
      - 'tests/test_packaging_adapters.py'
      - 'tests/test_ipa_size_report.py'
      - 'scripts/rehearse_packaging_integration.py'
      - 'tests/fixtures/upstream-packaging/**'
      - 'docs/PACKAGING_PATCH_SURFACE.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-semantic:
    name: Frozen semantic contracts (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run all provenance and immutable historical semantic tests
        run: python3 -B -m unittest discover -s ci/validation-history -p 'test_*.py' -v
      - name: Verify historical ancestry and production source boundaries
        run: python3 -B ci/validation-history/verify.py
  packaging-contract:
    needs: historical-semantic
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen release history and exact reviewed current packaging source
        run: python3 -B ci/validation-history/source_contract.py --packaging
      - name: Reject malformed successor mappings and source drift
        run: python3 -B -m unittest discover -s ci/validation-history -p 'test_source_contract.py' -v
      - name: Exercise synthetic packaging and source-built converter contracts
        shell: bash
        run: |
          set -euo pipefail
          command -v xcrun
          xcrun --find clang
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p test_combined_packaging.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p test_dylibify_source_build.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p test_packaging_adapters.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p test_ipa_size_report.py -v
