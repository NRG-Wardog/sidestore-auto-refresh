name: LiveContainer embedded SideStore build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release, complete sign-in preflight, or input-focus diagnosis (no IPA)'
        type: choice
        required: false
        default: release
        options:
          - release
          - preflight
          - input-diagnostic
  push:
    branches: [fix/combined-refresh-build-and-runtime, fix/v3.0.3-auth-errors, fix/v3.1.0-audit]

permissions:
  contents: read

concurrency:
  group: livecontainer-${{ github.ref }}
  cancel-in-progress: true

env:
  # Sign-in diagnostics keep their original independent upstream fixture.
  LEGACY_EMBEDDED_SIDESTORE_REF: ff25922e5c13ccfafd83bda5092910d848ebd409
  SIDESIGN_GSA_FIX: 35993d7f68950ce00d6bf1fd0fbcaa7bef51dc9c

jobs:
  select-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.select.outputs.lane }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - name: Select required workflow lane
        id: select
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_MODE: ${{ github.event.inputs.mode || '' }}
        run: python3 builder/scripts/select_livecontainer_lane.py

  signin-preflight:
    name: ${{ needs.select-lane.outputs.lane == 'input-diagnostic' && 'Input focus diagnostic (not acceptance)' || 'signin-preflight' }}
    needs: select-lane
    if: needs.select-lane.outputs.lane == 'preflight' || needs.select-lane.outputs.lane == 'input-diagnostic'
    # Controlled architecture comparison; exact Xcode and fixture remain unchanged.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - name: Select Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"
      - name: Verify focused fixture and evidence contracts
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          python3 builder/scripts/run_required_tests.py \
            --start-directory builder/tests --pattern 'test_p0_signin*.py' \
            --allowlist builder/scripts/required_test_skip_allowlist.json \
            --timings-output artifacts/logs/signin-preflight-test-timings.json \
            --verbosity 2 2>&1 | tee artifacts/logs/signin-preflight-tests.log
      - name: Checkout pinned SideStore for native Anisette preflight
        uses: actions/checkout@v4
        with:
          repository: LiveContainer/SideStore
          ref: ${{ env.LEGACY_EMBEDDED_SIDESTORE_REF }}
          path: work/AnisettePreflightSideStore
          persist-credentials: false
          submodules: false
      - name: Verify isolated Anisette recovery before UI execution
        timeout-minutes: 15
        shell: bash
        env:
          EMBEDDED_SIDESTORE_TEST_SOURCE: ${{ github.workspace }}/work/AnisettePreflightSideStore
        run: |
          set -euo pipefail
          test "$(git -C "$EMBEDDED_SIDESTORE_TEST_SOURCE" rev-parse HEAD)" = "$LEGACY_EMBEDDED_SIDESTORE_REF"
          python3 builder/scripts/run_required_tests.py \
            --start-directory builder/tests --pattern 'test_anisette*.py' \
            --allowlist builder/scripts/required_test_skip_allowlist.json \
            --timings-output artifacts/logs/signin-preflight-anisette-test-timings.json \
            --verbosity 2 2>&1 | tee artifacts/logs/signin-preflight-anisette-tests.log
      - name: Execute selected sign-in test lane
        timeout-minutes: 100
        shell: bash
        env:
          CI_SIGNIN_LANE: ${{ needs.select-lane.outputs.lane }}
        run: |
          set -euo pipefail
          set --
          case "$CI_SIGNIN_LANE" in
            preflight) ;;
            input-diagnostic) set -- --input-diagnostic ;;
            *) echo "Unsupported sign-in lane" >&2; exit 1 ;;
          esac
          python3 builder/scripts/run_p0_signin_preflight.py \
            --output artifacts/p0-preflight "$@" 2>&1 | tee artifacts/logs/signin-preflight.log
      - name: Preserve focused sign-in evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.select-lane.outputs.lane }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            artifacts/p0-preflight/**/*.json
            artifacts/p0-preflight/**/*.jsonl
            artifacts/p0-preflight/**/*.png
            artifacts/p0-preflight/**/*.txt
            artifacts/p0-preflight/**/*.swift
            artifacts/p0-preflight/**/project/**
            artifacts/logs/signin-preflight*.log
            artifacts/logs/signin-preflight-test-timings.json
            artifacts/logs/signin-preflight-anisette-test-timings.json

      - name: Prepare bounded evidence transfer fragments
        id: evidence_fragments
        timeout-minutes: 5
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/run_p0_signin_rendering.py \
            --fragment-evidence artifacts/p0-preflight --fragment-output artifacts/evidence-transfer \
            --log-root artifacts/logs --builder-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Preserve bounded evidence metadata
        if: always() && steps.evidence_fragments.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.select-lane.outputs.lane }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-metadata
          if-no-files-found: error
          path: |
            artifacts/evidence-transfer/metadata.zip
            artifacts/evidence-transfer/transport-index.json
      - name: Preserve bounded phone images
        if: always() && steps.evidence_fragments.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.select-lane.outputs.lane }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-phone-images
          if-no-files-found: error
          path: |
            artifacts/evidence-transfer/phone-images.zip
            artifacts/evidence-transfer/transport-index.json
      - name: Preserve bounded tablet images
        if: always() && steps.evidence_fragments.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.select-lane.outputs.lane }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-tablet-images
          if-no-files-found: error
          path: |
            artifacts/evidence-transfer/tablet-images.zip
            artifacts/evidence-transfer/transport-index.json

  source-and-host-build:
    needs: select-lane
    if: needs.select-lane.outputs.lane == 'release'
    # Restore the original ARM64 runner after the controlled preflight passed.
    # All source/native/layout/package/upload verification gates remain required.
    runs-on: macos-26
    # User-requested two-hour UI envelope adds 40m to the measured 170m job budget.
    # Individual test/device hang bounds remain unchanged.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
          # Historical fixture equality and OLD provenance require baseline objects.
          fetch-depth: 0

      - name: Require final published maintained source pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          python3 builder/scripts/maintained_sources.py env >> "$GITHUB_ENV"
          cp builder/migration/maintained-sources.json artifacts/logs/maintained-source-pins.json

      - name: Acquire and verify maintained runtime sources
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/maintained_sources.py acquire --workspace "$GITHUB_WORKSPACE" \
            --output artifacts/logs/pinned-source-identity.json
          git -C work/EmbeddedSideStore/Dependencies/SideSign merge-base --is-ancestor "$SIDESIGN_GSA_FIX" HEAD
          printf 'sidestore=%s\nminimuxer=%s\nsidesign=%s\ngsa_fix_ancestor=%s\n' \
            "$EMBEDDED_SIDESTORE_REF" "$MINIMUXER_REF" "$SIDESIGN_REF" "$SIDESIGN_GSA_FIX" \
            | tee artifacts/logs/upstream-auth-provenance.txt

      - name: Preflight maintained packaging evidence before native work
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/combined_build_evidence.py preflight --product v3.0.3-rc \
            --source work/LiveContainer --side-source work/EmbeddedSideStore \
            --maintained-runtime-pins builder/migration/maintained-sources.json \
            | tee artifacts/logs/maintained-package-inputs.json

      - name: Acquire immutable historical regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          # Patch regression tests operate only on their historical fixtures.
          # These trees are never compiled into the maintained-source product.
          git clone --filter=blob:none https://github.com/NRG-Wardog/LiveContainer.git work/LegacyLiveContainer
          git -C work/LegacyLiveContainer checkout --detach 12377cf3b91d51739a33f14a302e5f522b238593
          git -C work/LegacyLiveContainer -c submodule.litehook.url=https://github.com/LiveContainerMirror/litehook.git submodule update --init --recursive
          git clone --filter=blob:none https://github.com/SideStore/SideStore.git work/LegacySideStore
          git -C work/LegacySideStore checkout --detach "$LEGACY_EMBEDDED_SIDESTORE_REF"
          git -C work/LegacySideStore submodule update --init --recursive
          python3 builder/scripts/verify_pinned_sources.py --live work/LegacyLiveContainer --side work/LegacySideStore \
            > artifacts/logs/historical-fixture-identity.json

      - name: Verify pinned transport format prerequisites before layout
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/maintained_sources.py verify --workspace "$GITHUB_WORKSPACE" \
            --output artifacts/logs/transport-format-inputs.json
          {
            rustc --version --verbose
            cargo --version
            rustfmt --version
            test "$(rustc --version)" = 'rustc 1.98.1 (48a229cea 2026-09-01)'
            test "$(cargo --version)" = 'cargo 1.98.1 (797e8a9bc 2026-08-05)'
            test "$(rustfmt --version)" = 'rustfmt 1.9.0-stable (48a229ceae 2026-09-01)'
            cargo fmt --check --manifest-path jktcp/Cargo.toml
            cargo fmt --check --manifest-path idevice/ffi/Cargo.toml
          } 2>&1 | tee artifacts/logs/transport-format-prerequisites.log

      - name: Select Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Install native certificate test dependency
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3

      - name: Run repository checks and historical patch regressions
        env:
          LIVE_CONTAINER_TEST_SOURCE: ${{ github.workspace }}/work/LegacyLiveContainer
          SIDESTORE_TEST_SOURCE: ${{ github.workspace }}/work/LegacySideStore
          EMBEDDED_SIDESTORE_TEST_SOURCE: ${{ github.workspace }}/work/LegacySideStore
          SIDESIGN_TEST_SOURCE: ${{ github.workspace }}/work/LegacySideStore/Dependencies/SideSign
          SIDESTORE_070_TEST_SOURCE: ${{ github.workspace }}/work/LegacySideStore
          REQUIRE_LC_CERTIFICATE_NATIVE_TESTS: "1"
          REQUIRE_SWIFT_070_CHECKS: "1"
          REQUIRE_PINNED_SOURCE_CLASSIFIER_TEST: "1"
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/run_required_tests.py \
            --start-directory builder/tests \
            --allowlist builder/scripts/required_test_skip_allowlist.json \
            --timings-output artifacts/logs/repository-test-timings.json \
            --verbosity 2 2>&1 | tee artifacts/logs/repository-tests.log

      - name: Test maintained acquisition and contract gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s builder/migration/tests -v
          python3 -B -m unittest discover -s builder/migration/contracts/tests -v

      - name: Verify maintained host and authentication sources
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 builder/scripts/maintained_sources.py verify --workspace "$GITHUB_WORKSPACE"
            swiftc -frontend -parse work/LiveContainer/MultitaskSupport/MultitaskAppWindow.swift
            swiftc -frontend -parse work/LiveContainer/MultitaskSupport/MultitaskDockView.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Models/AppLayoutStyle.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Views/AppList/LCGridAppCell.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Views/V3UnifiedShell.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/App/AppDelegate.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/App/LiveContainerAutoRefreshAlarm.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Views/Settings/LCEmbeddedSideStoreRefreshView.swift
            swiftc -frontend -parse work/LiveContainer/SideStoreSupport/SideStore.swift
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Core/Operations/StandaloneOperations/BackgroundRefreshAppsOperation.swift
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Core/Operations/PipelineOperations/UninstallAppOperation.swift
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Utils/iostreams/ConsoleLog.swift
            swiftc -frontend -parse work/EmbeddedSideStore/AltStore/AppDelegate.swift
            swiftc -frontend -parse work/EmbeddedSideStore/AltStore/Core/Model/DatabaseManager/DatabaseManager.swift
            plutil -lint work/LiveContainer/LiveContainer/Info.plist
            plutil -extract BGTaskSchedulerPermittedIdentifiers.0 raw work/LiveContainer/LiveContainer/Info.plist
            grep -Fq 'LIVE_REFRESH_LOG_RETENTION_V1' work/EmbeddedSideStore/SideStore/Utils/iostreams/ConsoleLog.swift
          } 2>&1 | tee artifacts/logs/host-preflight.log

      - name: Execute full layout regression
        # Standalone fixtures read the already-prepared Swift sources, not built
        # app products. Fail early without duplicating simulator lifecycles.
        # Legacy 35m + sign-in build 5m + devices 18m + 18m + capture/export 4m.
        # Observed valid cases need up to 166s before teardown; all assertions remain.
        # User-requested outer allowance; per-case/device bounds remain 240s/1080s.
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          git -C builder fetch --no-tags origin 7d8ae12905f8baa6e0ecc4dbdd3f25e2aa0e43fa
          printf 'Layout start: '; date -u
          python3 builder/scripts/run_issue25_rendering.py --livecontainer work/LiveContainer \
            --v3-source work/LiveContainer/LiveContainerSwiftUI/Views/V3UnifiedShell.swift \
            --require-p0-signin --output artifacts/layout-evidence 2>&1 | tee artifacts/logs/layout-rendering.log
          printf 'Layout finish: '; date -u

      - name: Preserve real layout measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-v3-layout-evidence
          path: |
            artifacts/layout-evidence/**/*.json
            artifacts/layout-evidence/**/*.jsonl
            artifacts/logs/layout-rendering.log
            artifacts/layout-evidence/**/*.png
            artifacts/layout-evidence/p0-signin/**/*.txt
            artifacts/layout-evidence/p0-signin/**/*.swift
            artifacts/layout-evidence/p0-signin/project/**
          if-no-files-found: warn
          retention-days: 90

      - name: Prepare bounded evidence transfer fragments
        id: evidence_fragments
        timeout-minutes: 5
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/run_p0_signin_rendering.py \
            --fragment-evidence artifacts/layout-evidence --fragment-output artifacts/evidence-transfer \
            --log-root artifacts/logs --builder-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Preserve bounded evidence metadata
        if: always() && steps.evidence_fragments.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: combined-v3-layout-metadata
          if-no-files-found: error
          path: |
            artifacts/evidence-transfer/metadata.zip
            artifacts/evidence-transfer/transport-index.json
      - name: Preserve bounded phone images
        if: always() && steps.evidence_fragments.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: combined-v3-layout-phone-images
          if-no-files-found: error
          path: |
            artifacts/evidence-transfer/phone-images.zip
            artifacts/evidence-transfer/transport-index.json
      - name: Preserve bounded tablet images
        if: always() && steps.evidence_fragments.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: combined-v3-layout-tablet-images
          if-no-files-found: error
          path: |
            artifacts/evidence-transfer/tablet-images.zip
            artifacts/evidence-transfer/transport-index.json

      - name: Build unified host before transport compilation
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project work/LiveContainer/LiveContainer.xcodeproj \
            -scheme LiveContainer -sdk iphoneos -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/livecontainer-derived-data" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee artifacts/logs/livecontainer-build.log

      # Cache downloaded dependencies only; never reuse patched sources or products.
      - name: Cache Cargo dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: combined-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ env.IDEVICE_REF }}-${{ env.JKTCP_REF }}-${{ hashFiles('builder/migration/maintained-sources.json') }}

      - name: Install build tools
        run: |
          set -euo pipefail
          if ! command -v ldid >/dev/null 2>&1; then HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid; fi
          if ! command -v bindgen >/dev/null 2>&1 || [ "$(bindgen --version)" != "bindgen 0.72.1" ]; then cargo install --locked --force bindgen-cli --version 0.72.1; fi
          rustup target add aarch64-apple-ios

      - name: Verify maintained CoreDevice transport sources
        run: |
          set -euo pipefail
          python3 builder/scripts/maintained_sources.py verify --workspace "$GITHUB_WORKSPACE" \
            > artifacts/logs/transport-source-parity.json
          ! grep -R -E 'rppairing_connect_quic|create_quic_listener|quinn::' \
            idevice/ffi/src/tunnel_provider.rs idevice/idevice/src/tunnel.rs
          grep -Fq 'packet.extend_from_slice(CDTUNNEL_MAGIC)' idevice/idevice/src/tunnel.rs
          grep -Fq 'effective_mss = negotiated_mtu.saturating_sub(60).min(1340)' idevice/ffi/src/tunnel_provider.rs
          grep -Fq 'HeartbeatClient::connect' idevice/ffi/src/tunnel_provider.rs
          grep -Fq 'run_sync_local(async move { fd.write_entire(data_slice).await })' idevice/ffi/src/afc.rs
          grep -Fq 'let data = unsafe { Box::from_raw(slice) };' idevice/ffi/src/lib.rs

      - name: Test maintained transport sources
        run: |
          set -euo pipefail
          git -C jktcp diff --check
          git -C idevice diff --check
          cargo test --locked --manifest-path jktcp/Cargo.toml --lib -- --skip tests::local_tcp --skip tests::handle_speed
          cargo check --locked --manifest-path idevice/ffi/Cargo.toml --features obfuscate

      - name: Build idevice for iOS
        working-directory: idevice
        run: |
          set -euo pipefail
          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            cargo build --locked --release --target aarch64-apple-ios --features obfuscate --manifest-path ffi/Cargo.toml
          test -f target/aarch64-apple-ios/release/libidevice_ffi.a
          test -f ffi/idevice.h
          grep -Fq 'tunnel_create_usb' ffi/idevice.h
          grep -Fq 'tunnel_heartbeat_is_active' ffi/idevice.h
          grep -Fq 'idevice_set_transport_log_callback' ffi/idevice.h
          python3 -B ../builder/scripts/verify_archive_symbols.py \
            target/aarch64-apple-ios/release/libidevice_ffi.a \
            ../artifacts/dependencies/idevice-symbols
          rm -rf swift/IDevice.xcframework
          cp ffi/idevice.h swift/include/idevice.h
          xcodebuild -create-xcframework -library target/aarch64-apple-ios/release/libidevice_ffi.a \
            -headers swift/include -output swift/IDevice.xcframework

      - name: Stage built idevice framework for maintained minimuxer
        shell: bash
        run: |
          set -euo pipefail
          MUX=work/EmbeddedSideStore/Dependencies/minimuxer
          mkdir -p "$MUX/DeviceGateway/LocalBinary"
          rm -rf "$MUX/DeviceGateway/LocalBinary/IDevice.xcframework"
          cp -R idevice/swift/IDevice.xcframework "$MUX/DeviceGateway/LocalBinary/IDevice.xcframework"
          git -C "$MUX" diff --check
          while IFS= read -r -d '' source; do swiftc -frontend -parse "$source"; done < <(find "$MUX" -type f -name '*.swift' -not -path '*/.build/*' -print0)
          swift package --package-path "$MUX/DeviceGateway" dump-package >"$RUNNER_TEMP/combined-gateway-package.json"

      # Host source is final and already compiled; retain the exact prepared tree.
      # Keep native compilation serial with the earlier simulator suite.
      - name: Build embedded SideStore
        id: embedded_build
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          printf 'Native build start: '; date -u
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts/https___github_com_krzyzanowskim_OpenSSL_releases_download_3_6_2000_OpenSSL_xcframework_zip"
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/*/SourcePackages/artifacts/openssl
          artifact="$HOME/Library/Caches/org.swift.swiftpm/artifacts/https___github_com_krzyzanowskim_OpenSSL_releases_download_3_6_2000_OpenSSL_xcframework_zip"
          resolved=0
          for attempt in 1 2 3; do
            rm -rf "$artifact"
            rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/*/SourcePackages/artifacts/openssl 2>/dev/null || true
            rm -rf "$RUNNER_TEMP/embedded-sidestore-derived-data/SourcePackages/artifacts/openssl"
            if xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile -disablePackageRepositoryCache \
                -project work/EmbeddedSideStore/AltStore.xcodeproj -scheme SideStore \
                -derivedDataPath "$RUNNER_TEMP/embedded-sidestore-derived-data"; then resolved=1; break; fi
            sleep 2
          done
          test "$resolved" -eq 1
          ANISETTE="$RUNNER_TEMP/embedded-sidestore-derived-data/SourcePackages/checkouts/AnisetteKit"
          mkdir -p artifacts/dependencies
          python3 builder/scripts/maintained_sources.py anisette --anisette-source "$ANISETTE" \
            --output artifacts/dependencies/anisette-isolated-otp-before-build.json
          python3 builder/scripts/maintained_sources.py verify --workspace "$GITHUB_WORKSPACE" \
            --anisette-source "$ANISETTE" --after-build \
            --output artifacts/logs/maintained-sources-before-native-build.json
          # Compile the exact remote-resolved source; do not resolve again.
          xcodebuild -project work/EmbeddedSideStore/AltStore.xcodeproj -onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution \
            -scheme SideStore -sdk iphoneos -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/embedded-sidestore-derived-data" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee artifacts/logs/embedded-sidestore-build.log
          python3 builder/scripts/maintained_sources.py anisette --anisette-source "$ANISETTE" \
            --output artifacts/dependencies/anisette-isolated-otp-after-build.json
          cmp artifacts/dependencies/anisette-isolated-otp-before-build.json artifacts/dependencies/anisette-isolated-otp-after-build.json
          python3 builder/scripts/maintained_sources.py verify --workspace "$GITHUB_WORKSPACE" \
            --anisette-source "$ANISETTE" --after-build \
            --output artifacts/logs/maintained-sources-after-native-build.json
          cmp artifacts/logs/maintained-sources-before-native-build.json artifacts/logs/maintained-sources-after-native-build.json
          printf 'Native build finish: '; date -u

      - name: Package and verify combined LiveContainer plus SideStore
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/combined_build_evidence.py identity --product v3.0.3-rc \
            "$RUNNER_TEMP/livecontainer-derived-data/Build/Products/Release-iphoneos/LiveContainer.app" \
            "$RUNNER_TEMP/embedded-sidestore-derived-data/Build/Products/Release-iphoneos/SideStore.app"
          python3 builder/scripts/package_livecontainer_combined.py \
            --root work/LiveContainer \
            --host "$RUNNER_TEMP/livecontainer-derived-data/Build/Products/Release-iphoneos/LiveContainer.app" \
            --side "$RUNNER_TEMP/embedded-sidestore-derived-data/Build/Products/Release-iphoneos/SideStore.app" \
            --output artifacts/LiveContainer-SideStore-v3.0.3-rc.ipa 2>&1 | tee artifacts/logs/combined-packaging.log
          python3 builder/scripts/patch_combined_refresh_contract.py --verify-ipa artifacts/LiveContainer-SideStore-v3.0.3-rc.ipa \
            2>&1 | tee artifacts/logs/runtime-contract-verification.log
          printf 'builder_commit=%s\n' "$GITHUB_SHA" > artifacts/builder-commit.txt
          python3 builder/scripts/combined_build_evidence.py collect --product v3.0.3-rc \
            --ipa artifacts/LiveContainer-SideStore-v3.0.3-rc.ipa --output artifacts/debug-evidence --source work/LiveContainer --side-source work/EmbeddedSideStore \
            --anisette-source "$RUNNER_TEMP/embedded-sidestore-derived-data/SourcePackages/checkouts/AnisetteKit" \
            --anisette-manifest artifacts/dependencies/anisette-isolated-otp-after-build.json \
            --maintained-runtime-pins builder/migration/maintained-sources.json \
            "$RUNNER_TEMP/livecontainer-derived-data/Build/Products/Release-iphoneos" \
            "$RUNNER_TEMP/embedded-sidestore-derived-data/Build/Products/Release-iphoneos"
          python3 builder/scripts/verify_candidate_ipa.py \
            --ipa artifacts/LiveContainer-SideStore-v3.0.3-rc.ipa \
            --provenance artifacts/debug-evidence/candidate-provenance.json \
            --product v3.0.3-rc \
            --side-source work/EmbeddedSideStore \
            --maintained-runtime-pins builder/migration/maintained-sources.json \
            --builder-commit "$GITHUB_SHA" \
            --build-run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output artifacts/candidate-package-verification.json

      - name: Verify embedded CoreDevice transport executable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          ipa = Path('artifacts/LiveContainer-SideStore-v3.0.3-rc.ipa')
          embedded = 'Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore'
          with zipfile.ZipFile(ipa) as archive:
              executable = archive.read(embedded)
          assert executable[:4] == b'\xcf\xfa\xed\xfe', 'Expected embedded arm64 Mach-O'
          assert b'no ipsec interface (required for lockdown on iOS 26.4+)' not in executable, 'Obsolete IPSec guard remains'
          markers = ('[SIDESTORE_COREDEVICE] PAIRING_MODE_SELECTED', '[SIDESTORE_COREDEVICE] TRANSPORT_CREATE_PASS',
                     '[SIDESTORE_COREDEVICE] ENDPOINT_SELECT', '[SIDESTORE_COREDEVICE] LOCALVPN_UTUN_ACCEPTED',
                     '[SIDESTORE_COREDEVICE] JKTCP_MSS_CONFIG')
          for marker in markers:
              assert marker.encode() in executable, f'Embedded transport marker missing: {marker}'
          Path('artifacts/logs/embedded-transport-verification.txt').write_text(
              f'executable={embedded}\n' + '\n'.join(markers) + '\nverification=PASS\n')
          PY

      - name: Record actual dependency and toolchain evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/dependencies
          cp idevice/Cargo.lock artifacts/dependencies/idevice-Cargo.lock 2>/dev/null || true
          cp jktcp/Cargo.lock artifacts/dependencies/jktcp-Cargo.lock 2>/dev/null || true
          cp work/EmbeddedSideStore/AltStore.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved artifacts/dependencies/Package.resolved 2>/dev/null || true
          cp "$RUNNER_TEMP/embedded-sidestore-derived-data/SourcePackages/workspace-state.json" artifacts/dependencies/workspace-state.json 2>/dev/null || true
          set +e
          record() { printf '\ncommand:'; printf ' %q' "$@"; printf '\n'; "$@"; printf 'exit_status=%s\n' "$?"; }
          { record xcodebuild -version; record xcrun clang --version; record swift --version; record rustc --version; record cargo --version; record bindgen --version; record brew list --versions ldid openssl@3; } > artifacts/dependencies/tool-versions.txt 2>&1
          printf 'runner_os=%s\nrunner_arch=%s\nimage=%s\nimage_version=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion" >> artifacts/dependencies/tool-versions.txt

      - name: Upload combined LiveContainer IPA
        id: upload_ipa
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-SideStore-v3.0.3-rc-IPA
          path: |
            artifacts/LiveContainer-SideStore-v3.0.3-rc.ipa
            artifacts/LiveContainer-SideStore-v3.0.3-rc.verification.json
            artifacts/LiveContainer-SideStore-v3.0.3-rc.runtime-verification.json
            artifacts/builder-commit.txt
            artifacts/debug-evidence/candidate-provenance.json
            artifacts/candidate-package-verification.json
            artifacts/logs/upstream-auth-provenance.txt
            artifacts/logs/pinned-source-identity.json
            artifacts/logs/maintained-source*.json
            artifacts/dependencies
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # Keep the already verified binary with symbols if the artifact service had
      # any upload failure. This last-resort copy is evidence, not acceptance.
      - name: Preserve verified IPA after upload trouble
        if: ${{ !cancelled() && steps.upload_ipa.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/debug-evidence/recovery
          cp artifacts/LiveContainer-SideStore-v3.0.3-rc.ipa artifacts/debug-evidence/recovery/
          cp artifacts/builder-commit.txt artifacts/candidate-package-verification.json artifacts/debug-evidence/recovery/

      - name: Retry combined LiveContainer IPA upload
        id: retry_upload_ipa
        if: ${{ !cancelled() && steps.upload_ipa.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-SideStore-v3.0.3-rc-IPA-retry
          path: |
            artifacts/LiveContainer-SideStore-v3.0.3-rc.ipa
            artifacts/LiveContainer-SideStore-v3.0.3-rc.verification.json
            artifacts/LiveContainer-SideStore-v3.0.3-rc.runtime-verification.json
            artifacts/builder-commit.txt
            artifacts/debug-evidence/candidate-provenance.json
            artifacts/candidate-package-verification.json
            artifacts/logs/upstream-auth-provenance.txt
            artifacts/logs/pinned-source-identity.json
            artifacts/logs/maintained-source*.json
            artifacts/dependencies
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Recover combined LiveContainer IPA upload
        id: recovery_upload_ipa
        if: ${{ !cancelled() && steps.retry_upload_ipa.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-SideStore-v3.0.3-rc-IPA-recovery
          path: |
            artifacts/LiveContainer-SideStore-v3.0.3-rc.ipa
            artifacts/LiveContainer-SideStore-v3.0.3-rc.verification.json
            artifacts/LiveContainer-SideStore-v3.0.3-rc.runtime-verification.json
            artifacts/builder-commit.txt
            artifacts/debug-evidence/candidate-provenance.json
            artifacts/candidate-package-verification.json
            artifacts/logs/upstream-auth-provenance.txt
            artifacts/logs/pinned-source-identity.json
            artifacts/logs/maintained-source*.json
            artifacts/dependencies
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload source-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livecontainer-autorefresh-build-evidence
          path: |
            artifacts/logs
            artifacts/dependencies
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve matching crash symbols and generated startup source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-v3-debug-evidence
          path: artifacts/debug-evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Require a successful candidate upload
        id: confirmed_candidate
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PRIMARY: ${{ steps.upload_ipa.outcome }}
          RETRY: ${{ steps.retry_upload_ipa.outcome }}
          RECOVERY: ${{ steps.recovery_upload_ipa.outcome }}
          ARTIFACT_ID: ${{ steps.upload_ipa.outcome == 'success' && steps.upload_ipa.outputs.artifact-id || steps.retry_upload_ipa.outcome == 'success' && steps.retry_upload_ipa.outputs.artifact-id || steps.recovery_upload_ipa.outcome == 'success' && steps.recovery_upload_ipa.outputs.artifact-id || '' }}
        run: |
          set -euo pipefail
          if [[ "$PRIMARY" != success && "$RETRY" != success && "$RECOVERY" != success ]]; then
            echo 'No candidate upload succeeded; preserved recovery evidence is not delivery acceptance.' >&2
            exit 1
          fi
          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Successful upload did not return a confirmed artifact ID.' >&2
            exit 1
          fi
          printf 'artifact-id=%s\n' "$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

      - name: Download uploaded candidate for delivery verification
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.confirmed_candidate.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts/downloaded-ipa

      - name: Download uploaded source and symbol evidence
        uses: actions/download-artifact@v4
        with:
          name: combined-v3-debug-evidence
          path: artifacts/downloaded-debug-evidence

      - name: Verify the actual uploaded candidate and evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/verify_candidate_ipa.py \
            --ipa artifacts/downloaded-ipa/LiveContainer-SideStore-v3.0.3-rc.ipa \
            --provenance artifacts/downloaded-debug-evidence/candidate-provenance.json \
            --product v3.0.3-rc \
            --side-source work/EmbeddedSideStore \
            --maintained-runtime-pins builder/migration/maintained-sources.json \
            --builder-commit "$GITHUB_SHA" \
            --build-run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output artifacts/downloaded-candidate-verification.json
