name: LiveContainer embedded SideStore build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LIVE_CONTAINER_REF: 12377cf3b91d51739a33f14a302e5f522b238593
  EMBEDDED_SIDESTORE_REF: 10ffa01ecdfe4203a7ad5d7f41c0d5de03bd8abb

jobs:
  source-and-host-build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false

      - name: Checkout pinned LiveContainer sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/LiveContainer/LiveContainer.git work/LiveContainer
          git -C work/LiveContainer checkout --detach "$LIVE_CONTAINER_REF"
          git -C work/LiveContainer submodule update --init --recursive --depth=1

      - name: Checkout pinned embedded SideStore sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/LiveContainer/SideStore.git work/EmbeddedSideStore
          git -C work/EmbeddedSideStore checkout --detach "$EMBEDDED_SIDESTORE_REF"
          git -C work/EmbeddedSideStore submodule update --init --recursive --depth=1

      - name: Apply and verify host integration
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/patch_livecontainer_autorefresh.py work/LiveContainer
          python3 builder/scripts/patch_livecontainer_autorefresh.py work/LiveContainer
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "background_patch", "builder/scripts/patch_background_automation.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.patch_background_operation(Path("work/EmbeddedSideStore"))
          module.patch_console_log(Path("work/EmbeddedSideStore"))
          PY
          swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/App/AppDelegate.swift
          swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/App/LiveContainerAutoRefreshAlarm.swift
          swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Views/Settings/LCEmbeddedSideStoreRefreshView.swift
          swiftc -frontend -parse work/LiveContainer/SideStoreSupport/SideStore.swift
          swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Core/Operations/StandaloneOperations/BackgroundRefreshAppsOperation.swift
          swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Utils/iostreams/ConsoleLog.swift
          plutil -extract BGTaskSchedulerPermittedIdentifiers.0 raw work/LiveContainer/LiveContainer/Info.plist
          xcodebuild -list -project work/LiveContainer/LiveContainer.xcodeproj
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts/https___github_com_krzyzanowskim_OpenSSL_releases_download_3_6_2000_OpenSSL_xcframework_zip"
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/*/SourcePackages/artifacts/openssl
          test -f work/EmbeddedSideStore/AltStore.xcodeproj/project.pbxproj
          grep -Fq 'LIVE_REFRESH_LOG_RETENTION_V1' work/EmbeddedSideStore/SideStore/Utils/iostreams/ConsoleLog.swift

      - name: Build host and embedded SideStore source targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          xcodebuild -project work/LiveContainer/LiveContainer.xcodeproj \
            -scheme LiveContainer -sdk iphoneos -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/livecontainer-derived-data" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            2>&1 | tee artifacts/logs/livecontainer-build.log
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts/https___github_com_krzyzanowskim_OpenSSL_releases_download_3_6_2000_OpenSSL_xcframework_zip"
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/*/SourcePackages/artifacts/openssl
          artifact="$HOME/Library/Caches/org.swift.swiftpm/artifacts/https___github_com_krzyzanowskim_OpenSSL_releases_download_3_6_2000_OpenSSL_xcframework_zip"
          resolved=0
          for attempt in 1 2 3; do
            rm -rf "$artifact"
            rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/*/SourcePackages/artifacts/openssl 2>/dev/null || true
            if xcodebuild -resolvePackageDependencies -disablePackageRepositoryCache \
                -project work/EmbeddedSideStore/AltStore.xcodeproj -scheme SideStore; then
              resolved=1
              break
            fi
            sleep 2
          done
          test "$resolved" -eq 1
          xcodebuild -project work/EmbeddedSideStore/AltStore.xcodeproj \
            -scheme SideStore -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            2>&1 | tee artifacts/logs/embedded-sidestore-build.log

      - name: Package unsigned LiveContainer IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/livecontainer-derived-data/Build/Products/Release-iphoneos/LiveContainer.app"
          test -d "$APP"
          test -f "$APP/LiveContainer"
          test "$(plutil -extract CFBundleDisplayName raw "$APP/Info.plist")" = "LiveContainer"
          mkdir -p artifacts/LiveContainer-AutoRefresh/Payload
          cp -R "$APP" artifacts/LiveContainer-AutoRefresh/Payload/LiveContainer.app
          (
            cd artifacts/LiveContainer-AutoRefresh
            zip -qry ../LiveContainer-AutoRefresh.ipa Payload
          )
          unzip -t artifacts/LiveContainer-AutoRefresh.ipa >/tmp/livecontainer-ipa-unzip-test.txt
          unzip -q artifacts/LiveContainer-AutoRefresh.ipa -d /tmp/livecontainer-ipa-check
          test -f /tmp/livecontainer-ipa-check/Payload/LiveContainer.app/LiveContainer
          find /tmp/livecontainer-ipa-check/Payload/LiveContainer.app -type f -size +32k -print0 \
            | xargs -0 strings >/tmp/livecontainer-strings.txt
          grep -Fq '[AUTO_REFRESH] REGISTER_PASS' /tmp/livecontainer-strings.txt
          grep -Fq '[AUTO_REFRESH] SCHEDULE_PASS' /tmp/livecontainer-strings.txt
          grep -Fq '[AUTO_REFRESH] OPERATION_START' /tmp/livecontainer-strings.txt
          grep -Fq '[AUTO_REFRESH] COMPLETE' /tmp/livecontainer-strings.txt
          SHA="$(shasum -a 256 artifacts/LiveContainer-AutoRefresh.ipa | awk '{print $1}')"
          SIZE="$(stat -f '%z' artifacts/LiveContainer-AutoRefresh.ipa)"
          {
            echo 'LiveContainer native auto-refresh build'
            echo "builder_commit=$GITHUB_SHA"
            echo "livecontainer_ref=$LIVE_CONTAINER_REF"
            echo "embedded_sidestore_ref=$EMBEDDED_SIDESTORE_REF"
            echo "ipa_size=$SIZE"
            echo "ipa_sha256=$SHA"
            echo 'signing=unsigned-source-build; resign before device installation'
            echo 'verification=PASS'
          } | tee artifacts/LiveContainer-AutoRefresh-verification.txt

      - name: Upload LiveContainer IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-AutoRefresh-IPA
          path: |
            artifacts/LiveContainer-AutoRefresh.ipa
            artifacts/LiveContainer-AutoRefresh-verification.txt
            /tmp/livecontainer-ipa-unzip-test.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload source-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livecontainer-autorefresh-build-evidence
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
