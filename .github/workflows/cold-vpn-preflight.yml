name: Focused cold VPN and setup runtime qualification
on:
  workflow_dispatch:
  push:
    branches: ['validation/cold-vpn-preflight']
    paths: ['ci/cold-vpn/**', 'ci/language-switch/**', 'ci/issues-native/**', '.github/workflows/cold-vpn-preflight.yml']
permissions:
  contents: read
concurrency:
  group: cold-vpn-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  simulator:
    if: github.repository == 'NRG-Wardog/sidestore-auto-refresh' && github.ref == 'refs/heads/validation/cold-vpn-preflight'
    runs-on: macos-26
    timeout-minutes: 27
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_ALLOW_PROTOCOL: https
      GIT_NO_REPLACE_OBJECTS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize bounded evidence
        id: initialized
        run: mkdir -p evidence sources
      - name: Checkout exact harness only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NRG-Wardog/sidestore-auto-refresh
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false
      - name: Require source-owned fixture controls
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m unittest discover -s harness/ci/cold-vpn -p 'test_*.py' -v 2>&1 | tee evidence/controls.log
      - name: Acquire and verify same immutable candidate source graph
        id: source_gate
        run: |
          set -euo pipefail
          python3 -B harness/ci/issues-native/record.py acquire 2>&1 | tee evidence/acquisition.log
          python3 -B harness/ci/issues-native/verify_candidate_graph.py 2>&1 | tee evidence/source-graph.log
          python3 -B harness/ci/issues-native/test_upstream_candidate_projection.py
          python3 -B harness/ci/issues-native/test_cold_vpn_cache_projection.py
          python3 -B harness/ci/issues-native/test_current_vpn_guard_projection.py
          python3 -B harness/ci/issues-native/test_grace_recovery_projection.py
          python3 -B harness/ci/issues-native/test_early_readiness_projection.py
          python3 -B harness/ci/issues-native/upstream_candidate_projection.py --sources sources --output evidence/upstream-runtime-projection-preflight.json
          python3 -B harness/ci/issues-native/project_candidate_contracts.py
          python3 -B harness/ci/issues-native/preflight_comprehensive_pairing.py --sources sources --output evidence/comprehensive-pairing-preflight
          { xcodebuild -version; swift --version; xcrun --sdk iphonesimulator --show-sdk-version; } > evidence/toolchain.log
          xcodebuild -version | grep -Fx 'Xcode 26.4.1'
      - name: Mandatory cold VPN source execution and iOS deployment-target typecheck
        run: |
          set -euo pipefail
          python3 -B harness/ci/cold-vpn/run_cold_vpn_tests.py --sources sources --output evidence \
            2>&1 | tee evidence/cold-vpn-driver.log
      - name: Compile and execute complete setup recovery suite against delivered baseline
        id: setup_tests
        if: ${{ !cancelled() && steps.source_gate.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 -B harness/ci/issues-native/test_setup_state_recovery_contract.py
          python3 -B harness/ci/issues-native/verify_setup_state_recovery.py run \
            --sources sources --swiftc "$(command -v swiftc)" --output evidence/setup-state-recovery --contract evidence/candidate-contracts/setup-state-recovery-contract.json \
            2>&1 | tee evidence/setup-state-recovery.log
          printf '0\n' > evidence/setup-state-recovery.exit-code.txt
      - name: Preserve complete owned setup failure evidence, not app products
        if: ${{ !cancelled() && steps.setup_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: focused-setup-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/setup-state-recovery.log
            evidence/setup-state-recovery/
          if-no-files-found: error
          retention-days: 14
      - name: Execute same-session language simulator and iOS deployment-target checks
        id: language_switch_tests
        if: ${{ !cancelled() && steps.source_gate.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s harness/ci/language-switch -p 'test_*.py' -v
          python3 -B harness/ci/language-switch/run_language_switch_tests.py --sources sources --output evidence \
            2>&1 | tee evidence/language-switch-driver.log
      - name: Preserve observations and runtime failure evidence only
        if: ${{ !cancelled() && steps.initialized.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cold-vpn-preflight-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/*.log
            evidence/*.json
            evidence/cold-vpn/*.log
            evidence/cold-vpn/*.json
            evidence/candidate-contracts/*.json
            evidence/setup-state-recovery/
            evidence/language-switch/*.log
            evidence/language-switch/*.json
          if-no-files-found: error
          retention-days: 14
