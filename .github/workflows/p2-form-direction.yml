name: P2 paired Form direction observation
on:
  push:
    branches: [validation/p2-alert-lifecycle]
    paths:
      - .github/workflows/p2-form-direction.yml
      - ci/p2/form_direction/**
permissions:
  contents: read
concurrency:
  group: p2-form-direction-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired-form:
    if: github.repository == 'NRG-Wardog/sidestore-auto-refresh' && github.ref == 'refs/heads/validation/p2-alert-lifecycle'
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      APPROVED_FORM_INPUTS_SHA256: 44a00f7d4dc3a54d00167e728c8d96fb6de242fb4ee62f2013dae2e91fa2cc8d
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_COUNT: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: builder
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NRG-Wardog/LiveContainer
          ref: eb10cedb772bc0496d67edd7a269679e24826b9f
          path: source
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
          submodules: false
      - name: Strict paired-observation and ownership tests
        run: |
          set -euo pipefail
          P2_FORM_SOURCE="$GITHUB_WORKSPACE/source" python3 -B -m unittest discover -s builder/ci/p2/form_direction -p 'test_*.py' -v 2>&1 | tee p2-form-portable.log
      - name: Build component fixture once and observe both fixed arms
        run: |
          set -euo pipefail
          python3 -B builder/ci/p2/form_direction/run.py \
            --host "$GITHUB_WORKSPACE/source" \
            --approved-inputs-sha256 "$APPROVED_FORM_INPUTS_SHA256" \
            --work "$GITHUB_WORKSPACE/p2-form-work" \
            --evidence "$GITHUB_WORKSPACE/p2-form-evidence" \
            --publish "$GITHUB_WORKSPACE/p2-form-publish"
      - name: Retain failed and successful observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-form-direction-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            p2-form-publish/**
            p2-form-portable.log
          if-no-files-found: error
          retention-days: 30
