name: Validate current repository contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity:
    name: Reviewed source integrity (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject source drift and malformed manifests
        run: python3 -B -m unittest discover -s tests/ci/integrity -p 'test_*.py' -v
      - name: Verify reviewed current source boundaries
        run: python3 -B ci/contracts/integrity/verify.py
      - name: Verify current entry and receipt failure controls
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests/ci/build -p 'test_*.py' -v
          python3 -B -m unittest discover -s tests/ci/native -p test_workflow_failure_collection.py -v
          python3 -B -m unittest discover -s tests/ci/native -p test_openssl_local_packaging.py -v
          python3 -B -m unittest discover -s tests/ci/native -p test_unsigned_widget_workflow.py -v
          python3 -B -m unittest discover -s tests/ci/native -p test_russian_setup_projection.py -v
          python3 -B -m unittest discover -s tests/ci/native -p test_portal_owner_successor.py -v
          python3 -B -m unittest discover -s tests/ci/native -p test_preservation_evidence_projection.py -v
          python3 -B -m unittest discover -s tests/ci/vpn -p 'test_*.py' -v
          python3 -B -m unittest discover -s tests/ci/size -p test_same_run_size.py -v
      - name: Verify portable packaging contracts without skips
        run: |
          set -euo pipefail
          for suite in test_packaging_adapters.py test_combined_packaging.py; do
            python3 -B scripts/run_required_tests.py --start-directory tests --pattern "$suite" --allowlist scripts/required_test_skip_allowlist.json
          done
  bounded-contracts:
    needs: source-integrity
    if: github.repository == 'NRG-Wardog/sidestore-auto-refresh'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_ALLOW_PROTOCOL: https
      GIT_NO_REPLACE_OBJECTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Acquire exact current owners before any product suite
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -B ci/build/record.py acquire 2>&1 | tee evidence/owner-acquisition.log
          python3 -B ci/build/verify_candidate_graph.py 2>&1 | tee evidence/owner-identity.log
      - name: Acquire immutable removed-UI inventory without changing current owner
        run: |
          set -euo pipefail
          historical_pin=ff25922e5c13ccfafd83bda5092910d848ebd409
          current_pin=$(python3 -c 'import json; print(json.load(open("ci/build/candidate-graph.json"))["owners"]["SideStore"][1])')
          test "$(git -C sources/SideStore rev-parse HEAD)" = "$current_pin"
          git -C sources/SideStore -c core.hooksPath=/dev/null fetch --no-tags origin "$historical_pin"
          test "$(git -C sources/SideStore rev-parse "$historical_pin^{commit}")" = "$historical_pin"
          test "$(git -C sources/SideStore rev-parse HEAD)" = "$current_pin"
          git -C sources/SideStore rev-parse "$historical_pin^{commit}" HEAD 'HEAD^{tree}' > evidence/removed-ui-inventory-identity.txt
      - name: Require complete product inventory and native regressions without skips
        run: |
          set -euo pipefail
          command -v xcrun
          xcrun --find clang
          xcrun --find swiftc
          brew list openssl@3 >/dev/null || brew install openssl@3
          export MAINTAINED_LIVE_CONTAINER_TEST_SOURCE="$PWD/sources/LiveContainer"
          export MAINTAINED_SIDESTORE_TEST_SOURCE="$PWD/sources/SideStore"
          export MAINTAINED_SIDESIGN_TEST_SOURCE="$PWD/sources/SideStore/Dependencies/SideSign"
          export MAINTAINED_MINIMUXER_TEST_SOURCE="$PWD/sources/SideStore/Dependencies/minimuxer"
          export MAINTAINED_IDEVICE_TEST_SOURCE="$PWD/sources/idevice"
          export MAINTAINED_ANISETTEKIT_TEST_SOURCE="$PWD/sources/AnisetteKit"
          export REQUIRE_LC_CERTIFICATE_NATIVE_TESTS=1
          python3 -B ci/contracts/verify_product_tests.py
          python3 -B scripts/run_required_tests.py --start-directory tests --pattern 'test_*.py' \
            --allowlist scripts/required_test_skip_allowlist.json --timings-output evidence/product-test-timings.json \
            2>&1 | tee evidence/product-tests.log
      - name: Require maintained source acquisition regression controls
        run: |
          set -euo pipefail
          python3 -B scripts/run_required_tests.py --start-directory migration/tests --pattern 'test_*.py' \
            --allowlist scripts/required_test_skip_allowlist.json --timings-output evidence/acquisition-test-timings.json \
            2>&1 | tee evidence/acquisition-tests.log
      - name: Retain regression evidence including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-regression-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
