name: Validate current repository contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity:
    name: Reviewed source integrity (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject source drift and malformed manifests
        run: python3 -B -m unittest discover -s ci/source-integrity -p 'test_*.py' -v
      - name: Verify reviewed current source boundaries
        run: python3 -B ci/source-integrity/verify.py
  bounded-contracts:
    needs: source-integrity
    if: github.repository == 'NRG-Wardog/sidestore-auto-refresh'
    runs-on: macos-26
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NRG-Wardog/LiveContainer
          ref: c7111b580254190a0c037037036aaed49bfce8c6
          path: maintained-implementation
          persist-credentials: false
          sparse-checkout: .github/workflows
      - name: Reject malformed manifests and source drift
        run: python3 -B -m unittest discover -s ci/source-integrity -p test_integrity.py -v
      - name: Verify current source boundaries
        run: python3 -B ci/source-integrity/verify.py
      - name: Verify immutable maintained entry and packaging boundaries
        env:
          MAINTAINED_IMPLEMENTATION_ROOT: ${{ github.workspace }}/maintained-implementation
        run: python3 -B ci/maintained-build/test_contract.py -v
      - name: Run bounded portable and native converter regressions
        run: |
          set -euo pipefail
          for name in test_repository.py test_combined_packaging.py test_compiled_localization.py test_required_test_runner.py test_combined_build_evidence.py test_merged_rendering_contract.py test_dylibify_source_build.py; do
            python3 -B -m unittest discover -s tests -p "$name" -v
          done
          python3 -B -m unittest discover -s migration/tests -p test_p1_admission.py -v
