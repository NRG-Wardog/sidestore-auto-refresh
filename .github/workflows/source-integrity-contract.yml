name: Validate current repository contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity:
    name: Reviewed source integrity (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject source drift and malformed manifests
        run: python3 -B -m unittest discover -s ci/source-integrity -p 'test_*.py' -v
      - name: Verify reviewed current source boundaries
        run: python3 -B ci/source-integrity/verify.py
      - name: Verify current entry and receipt failure controls
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s ci/current-build -p 'test_*.py' -v
          python3 -B -m unittest discover -s ci/issues-native -p test_workflow_failure_collection.py -v
          python3 -B -m unittest discover -s ci/cold-vpn -p 'test_*.py' -v
          python3 -B -m unittest discover -s ci/issue56-startup -p test_same_run_size.py -v
      - name: Verify portable packaging contracts without skips
        run: |
          set -euo pipefail
          for suite in test_packaging_adapters.py test_combined_packaging.py; do
            python3 -B scripts/run_required_tests.py --start-directory tests --pattern "$suite" --allowlist scripts/required_test_skip_allowlist.json
          done
  bounded-contracts:
    needs: source-integrity
    if: github.repository == 'NRG-Wardog/sidestore-auto-refresh'
    runs-on: macos-26
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run bounded portable and native converter regressions
        run: |
          set -euo pipefail
          command -v xcrun
          xcrun --find clang
          for name in test_packaging_adapters.py test_ipa_size_report.py test_repository.py test_combined_packaging.py test_compiled_localization.py test_required_test_runner.py test_combined_build_evidence.py test_merged_rendering_contract.py test_dylibify_source_build.py; do
            python3 -B -m unittest discover -s tests -p "$name" -v
          done
          python3 -B -m unittest discover -s migration/tests -p 'test_*.py' -v
      - name: Acquire maintained certificate owner and require native regressions
        run: |
          set -euo pipefail
          pin=$(python3 -c 'import json; print(json.load(open("ci/issues-native/candidate-graph.json"))["owners"]["LiveContainer"][1])')
          repository=$(python3 -c 'import json; print(json.load(open("ci/issues-native/candidate-graph.json"))["owners"]["LiveContainer"][0])')
          git init -q sources/LiveContainer
          git -C sources/LiveContainer remote add origin "https://github.com/$repository.git"
          git -C sources/LiveContainer -c core.hooksPath=/dev/null fetch --no-tags --depth=1 origin "$pin"
          git -C sources/LiveContainer -c core.hooksPath=/dev/null checkout --detach "$pin"
          brew list openssl@3 >/dev/null || brew install openssl@3
          MAINTAINED_LIVE_CONTAINER_TEST_SOURCE="$PWD/sources/LiveContainer" REQUIRE_LC_CERTIFICATE_NATIVE_TESTS=1 \
            python3 -B scripts/run_required_tests.py --start-directory tests --pattern test_lc_certificate_observation.py \
              --allowlist scripts/required_test_skip_allowlist.json
