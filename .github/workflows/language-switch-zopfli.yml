name: Verified quick lossless language-switch packaging
on:
  push:
    branches: [validation/language-switch-zopfli]
    paths: ['ci/language-switch-zopfli/**', '.github/workflows/language-switch-zopfli.yml']
permissions:
  contents: read
concurrency:
  group: language-switch-approved-quick-zopfli
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'NRG-Wardog/sidestore-auto-refresh' && github.ref == 'refs/heads/validation/language-switch-zopfli'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Run source-owned controls without executing compressor
        id: controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir zopfli-evidence workspace
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m unittest discover -s ci/language-switch-zopfli -p 'test_*.py' -v 2>&1 | tee zopfli-evidence/controls.log
      - name: Require exact successful issue56 native build and approved source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B ci/language-switch-zopfli/acquire.py
      - name: Verify official source closure before direct reviewed C compilation
        shell: bash
        run: |
          set -euo pipefail
          cp ci/language-switch-zopfli/{contract.py,zip32.py,sweep.py,limited_exec.py,verify_source.py,independent_verify.py,official-tree.json,official-commit.json} workspace/
          python3 -B workspace/verify_source.py 2>&1 | tee zopfli-evidence/input-verification.log
          test -x /usr/bin/cc
          { /usr/bin/cc --version; sha256sum "$(readlink -f /usr/bin/cc)"; } > zopfli-evidence/compiler.log
          (ulimit -v 2097152; ulimit -t 60; ulimit -c 0; timeout --kill-after=5s 60s /usr/bin/cc workspace/source/src/zopfli/*.c -O2 -std=c99 -Wall -Wextra -Wno-unused-function -lm -o workspace/zopfli) 2>&1 | tee zopfli-evidence/build.log
      - name: Bounded two-worker five-iteration pass with verified checkpoints
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=5s 1550s python3 -B workspace/sweep.py 2>&1 | tee zopfli-evidence/compression.log
      - name: Independently verify every payload and raw archive metadata
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=5s 180s python3 -B workspace/independent_verify.py --root workspace 2>&1 | tee zopfli-evidence/independent-audit.log
          (cd workspace; sha256sum recompressed.ipa > SHA256SUMS)
      - name: Upload only the final qualified copy and immutable lineage
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: language-switch-zopfli-qualified-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workspace/recompressed.ipa
            workspace/result.json
            workspace/input-manifest.json
            workspace/input-verification.json
            workspace/independent-audit.json
            workspace/provenance.json
            workspace/acquisition.json
            workspace/issue56-startup-tests.json
            workspace/language-switch-tests.json
            workspace/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain bounded non-secret diagnostics after attempted controls
        if: ${{ !cancelled() && (steps.controls.outcome == 'success' || steps.controls.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: language-switch-zopfli-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            zopfli-evidence/*.log
            workspace/*.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
