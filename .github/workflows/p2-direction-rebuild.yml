name: P2 direction reconstruction candidate
on:
  push:
    branches: [validation/p2-alert-lifecycle]
    paths:
      - .github/workflows/p2-direction-rebuild.yml
      - ci/p2/direction_rebuild/**
permissions:
  contents: read
concurrency:
  group: p2-direction-rebuild-${{ github.ref }}
  cancel-in-progress: false
jobs:
  direction-rebuild:
    if: github.repository == 'NRG-Wardog/sidestore-auto-refresh' && github.ref == 'refs/heads/validation/p2-alert-lifecycle'
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      APPROVED_FORM_INPUTS_SHA256: f87acd032e3577cdde0ce882480a0c575dbff7e2c77f1c6ea0a3f6b4e378b89e
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_COUNT: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: builder
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NRG-Wardog/LiveContainer
          ref: eb10cedb772bc0496d67edd7a269679e24826b9f
          path: source
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
          submodules: false
      - name: Strict candidate input and attachment tests
        run: |
          set -euo pipefail
          P2_FORM_SOURCE="$GITHUB_WORKSPACE/source" python3 -B -m unittest discover -s builder/ci/p2/direction_rebuild -p 'test_*.py' -v 2>&1 | tee p2-form-portable.log
      - name: Validate retained state and observe candidate EN HE EN
        run: |
          set -euo pipefail
          python3 -B builder/ci/p2/direction_rebuild/run.py \
            --host "$GITHUB_WORKSPACE/source" \
            --approved-inputs-sha256 "$APPROVED_FORM_INPUTS_SHA256" \
            --work "$GITHUB_WORKSPACE/p2-form-work" \
            --evidence "$GITHUB_WORKSPACE/p2-form-evidence" \
            --publish "$GITHUB_WORKSPACE/p2-form-publish"
      - name: Retain failed and successful observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-direction-rebuild-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            p2-form-publish/**
            p2-form-portable.log
          if-no-files-found: error
          retention-days: 30
